name: Deploy union proxy to Supabase

# supabase/functions/union-proxy 가 바뀌면 Supabase Edge Function으로 자동 배포한다.
# 필요 시크릿:
#   SUPABASE_ACCESS_TOKEN  (dash.supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_REF   (프로젝트 Settings → Reference ID)
# 함수 시크릿 PROXY_TOKEN 은 Supabase 대시보드(Edge Functions → Secrets)에서 설정.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/union-proxy/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-proxy.yaml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy union-proxy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy union-proxy \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
